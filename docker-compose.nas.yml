services:
  mcp-prawo-wrapper:
    build:
      context: /volume2/docker/mcp-prawo-wrapper
      dockerfile: Dockerfile.nas
    image: mcp-prawo-wrapper:local
    container_name: mcp-prawo-wrapper
    user: "1029:100"
    environment:
      TZ: Europe/Warsaw
      PRAWO_PL_MCP_SOURCES: "repertorium,saos,nsa,ms,legal-cite,krs,kio,uodo,pmi,eu-sparql,eureka,eu-compliance"
      PRAWO_PL_MCP_URL_REPERTORIUM: "http://mcp-repertorium:8000/mcp"
      PRAWO_PL_MCP_URL_SAOS: "http://mcp-saos:8000/mcp"
      PRAWO_PL_MCP_URL_NSA: "http://mcp-nsa:8000/mcp"
      PRAWO_PL_MCP_URL_LEGAL_CITE: "http://legal-cite:8080/mcp"
      PRAWO_PL_MCP_URL_KRS: "http://mcp-krs:8000/mcp"
      PRAWO_PL_MCP_URL_KIO: "http://mcp-kio:8000/mcp"
      PRAWO_PL_MCP_URL_MS: "http://mcp-ms:8000/mcp"
      PRAWO_PL_MCP_URL_PMI: "http://pmi:8000/mcp"
      PRAWO_PL_MCP_URL_UODO: "http://mcp-uodo:3000/mcp"
      PRAWO_PL_MCP_URL_EU_SPARQL: "http://mcp-eu-sparql:8000/mcp"
      PRAWO_PL_MCP_URL_EUREKA: "http://mcp-eureka:8000/mcp"
      PRAWO_PL_MCP_URL_EU_COMPLIANCE: "http://mcp-eu-compliance:8000/mcp"
      PRAWO_PL_MCP_TIMEOUT_LEGAL_CITE: "240"
      PRAWO_HYDRATE_TIMEOUT: "250"
      PRAWO_HYDRATE_CONCURRENCY: "3"
      PRAWO_MD_DIR: "/legal_sources"

    volumes:
      - /volume1/legal/opracowania/zrodla_prawne_mcp:/legal_sources:rw
    networks:
      - prawo_private
      - saos
      - nsa
      - cite
      - krs
      - repertorium
      - eu_sparql
      - uodo
    ports:
      - "8420:8000"
    healthcheck:
      test: ["CMD","python","-c","import socket; socket.create_connection(('127.0.0.1',8000),timeout=5).close()"]
      interval: 30s
      timeout: 7s
      retries: 5
    restart: unless-stopped

networks:
  prawo_private:
    external: true
    name: mcp_prawo_private
  saos:
    external: true
    name: cf_mcp_saos
  nsa:
    external: true
    name: cf_mcp_nsa
  cite:
    external: true
    name: cf_mcp_cite
  krs:
    external: true
    name: cf_mcp_krs
  repertorium:
    external: true
    name: cf_mcp_repertorium
  uodo:
    external: true
    name: cf_mcp_uodo
  eu_sparql:
    external: true
    name: cf_mcp_eu_sparql
