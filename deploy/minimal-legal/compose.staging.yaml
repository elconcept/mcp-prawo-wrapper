# STAGING ONLY. Nie podłączać do lex ani nie zastępować Repertorium przed E2E.
# Nie wymaga kopiowania ustawy.sqlite — lokalne USTAWY wywoływane przez LAN MCP.
# Po wdrożeniu PR USTAWY akt_po_eli jest bezpośrednim lokalnym źródłem Dz.U.
# Opcjonalny read-only snapshot SQLite może przyspieszyć odczyty, ale nie jest konieczny.
services:
  resolver:
    build:
      context: ../..
      dockerfile: deploy/minimal-legal/Dockerfile.resolver
    image: mcp-prawo-resolver:staging
    environment:
      - TZ=Europe/Warsaw
      - PRAWO_PL_MCP_SOURCES=saos,nsa,ustawy,eu-sparql,krs,uodo
      - PRAWO_PL_MCP_URL_SAOS=http://mcp-saos:8000/mcp
      - PRAWO_PL_MCP_URL_NSA=http://mcp-nsa:8000/mcp
      - PRAWO_PL_MCP_URL_USTAWY=http://mcp-ustawy:8080/mcp
      - PRAWO_PL_MCP_URL_EU_SPARQL=http://mcp-eu-sparql:8000/mcp
      - PRAWO_PL_MCP_URL_KRS=http://mcp-krs:8000/mcp
      - PRAWO_PL_MCP_URL_UODO=http://mcp-uodo:3000/mcp
      - PRAWO_EU_PL_SQLITE=/data/eu-pl.sqlite
      - PRAWO_RESOLVER_CACHE=/data/prawo-resolver.sqlite
      - PRAWO_WEBWRIGHT_MCP_URL=http://webwright:8000/mcp
      - PRAWO_WEBWRIGHT_ARTIFACTS=/data/webwright/verified
    volumes:
      - resolver-data:/data
      - webwright-data:/data/webwright:ro
    ports:
      - "127.0.0.1:8414:8000"
    depends_on:
      - webwright
    networks: [legal_private, nas_lab]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pids_limit: 180
  webwright:
    build:
      context: ../..
      dockerfile: deploy/minimal-legal/Dockerfile.webwright
    image: mcp-webwright-legal-pl:staging
    environment:
      - TZ=Europe/Warsaw
      - WEBWRIGHT_DATA_DIR=/data/webwright
    volumes:
      - webwright-data:/data/webwright
    # Bez mapowania portów hosta. Dostępne tylko z sieci legal_private.
    networks: [legal_private]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pids_limit: 180
    shm_size: 512m

volumes:
  resolver-data:
  webwright-data:

networks:
  legal_private:
    internal: false  # Playwright musi pobierać oficjalne strony sądów/UE
  nas_lab:
    external: true
    name: lab  # Zweryfikowana współdzielona sieć NAS, bez fikcyjnych IP i portów hosta
