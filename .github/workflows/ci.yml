name: ci

# The gates run at release time too, but that is late: a broken commit would sit on
# main until someone tagged. This catches it at the commit.
#
# Smoke tests are deselected on purpose - they call live upstream sources, and an
# outage at a government portal is not a reason to redden our CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run gates
        run: python -m pytest tests/ -q -k "not smoke"

      - name: Ruff (new full-text pipeline)
        run: python -m ruff check src/prawo_pl_mcp/hydrate.py src/prawo_pl_mcp/md_store.py tests/test_repertorium_md.py

      - name: Build NAS Python 3.12 image
        run: docker build --file Dockerfile.nas --tag mcp-prawo-wrapper:ci .

      - name: Smoke-test installed image as UID 1029
        run: |
          docker run --rm --network none --user 1029:100 --read-only \
            --tmpfs /tmp:rw,exec,size=32m,mode=1777 \
            --entrypoint python mcp-prawo-wrapper:ci \
            -c "import sys; from prawo_pl_mcp import md_store; import prawo_pl_mcp.server; assert sys.version_info[:2] == (3, 12); assert md_store.REL_ROOT == 'opracowania/zrodla_prawne_mcp'"
